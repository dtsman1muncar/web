<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cetak PDF Artikel Pop-up</title>
    
    <!-- CDN Library html2pdf.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        /* CSS Utama Tampilan Pop-up di Web */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000;
        }

        .modal-card {
            background: #ffffff;
            width: 80%;
            max-width: 700px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            font-family: Arial, sans-serif;
            color: #333;
        }

        .modal-card img {
            width: 100%;
            height: auto;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        .btn-cetak {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 18px;
            font-size: 14px;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 20px;
        }

        /* --- KUNCI FIX PERULANGAN HALAMAN (CSS PRINT & PDF) --- */
        @media print {
            body * {
                visibility: hidden;
            }
            #printable-popup, #printable-popup * {
                visibility: visible;
            }
            #printable-popup {
                position: absolute;
                left: 0; top: 0;
                width: 100%;
                height: auto !important; /* Mencegah pembatasan tinggi yang memicu looping */
                overflow: visible !important;
            }
            .no-print {
                display: none !important; /* Sembunyikan tombol saat diunduh/dicetak */
            }
        }
    </style>
</head>
<body>

    <!-- Pop-up Modal Container -->
    <div class="modal-overlay">
        <div class="modal-card" id="printable-popup">
            
            <!-- Tombol Cetak (Tidak ikut terunduh ke PDF) -->
            <button class="btn-cetak no-print" onclick="downloadPDF()">Download PDF</button>

            <!-- Isi Artikel Dari JSON -->
            <div id="article-content">
                <img id="article-img" src="https://via.placeholder.com/600x300" alt="Foto Artikel">
                <h2 id="article-title">Memuat Judul...</h2>
                <p><strong>Oleh:</strong> <span id="article-author">-</span></p>
                <hr>
                <div id="article-body">
                    <p>Memuat isi artikel...</p>
                </div>
            </div>

        </div>
    </div>

    <script>
        // 1. Simulasi Data Artikel dari JSON
        const jsonArticleData = {
            "title": "Aroma Melati, Pelajaran Hidup, dan Mimpi yang Mulai Dirangkai",
            "author": "Agus Suyatno, S.Kom | SMAN 1 Muncar",
            "image": "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=600", // Contoh Foto
            "content": "Pagi itu, suasana belajar terlihat berbeda bagi siswa Program SMA Double Track... <br><br>Melalui kunjungan ke kebun melati milik mitra Dunia Usaha dan Dunia Industri (DUDI), para siswa diajak mengenal proses budidaya melati dari dekat..."
        };

        // 2. Tampilkan Data JSON ke Pop-up Modal
        document.getElementById('article-title').innerText = jsonArticleData.title;
        document.getElementById('article-author').innerText = jsonArticleData.author;
        document.getElementById('article-img').src = jsonArticleData.image;
        document.getElementById('article-body').innerHTML = jsonArticleData.content;

        // 3. Fungsi Utama Export PDF
        function downloadPDF() {
            const element = document.getElementById('printable-popup');

            // Konfigurasi Spesifik html2pdf
            const options = {
                margin:       10,
                filename:     'Artikel_Cerita_Baik.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true }, // useCORS Wajib Aktif Agar Foto Render
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' },
                
                // Mencegah looping / pemutusan halaman otomatis yang salah
                pagebreak:    { mode: ['avoid-all', 'css'] } 
            };

            // Sebelum generate, ubah sementara overflow agar tinggi terbaca utuh
            element.style.overflow = 'visible';

            html2pdf().set(options).from(element).save().then(() => {
                // Kembalikan overflow scroll untuk tampilan web pop-up
                element.style.overflow = 'auto';
            });
        }
    </script>
</body>
</html>
